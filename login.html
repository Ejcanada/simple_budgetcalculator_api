<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Log in | Heritage Travels</title>
</head>
<body class="is-auth">
<main>
  <div class="auth-art">
    <div>
      <h2>Know what a trip to the Taj Mahal costs before you book.</h2>
      <p>Budgets for landmarks in 20+ countries, saved to your account.</p>
    </div>
  </div>
  <div class="auth-panel">
    <div class="auth-card">
      <a class="brand" href="login.html">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V11a8 8 0 0 1 16 0v10M9 21v-8a3 3 0 0 1 6 0v8M2.5 21h19"/></svg>
        Heritage Travels
      </a>
      <h1 id="formTitle">Log in</h1>
      <p class="sub" id="formSub">Log in to see landmarks and your saved trips.</p>

      <form id="authForm" novalidate>
        <div id="nameGroup" hidden>
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" autocomplete="name" maxlength="100">
        </div>
        <div>
          <label for="email">Email or username</label>
          <input type="text" id="email" autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>
        <div>
          <label for="password">Password</label>
          <div class="pw">
            <input type="password" id="password" autocomplete="current-password" maxlength="72">
            <button type="button" id="togglePw" aria-label="Show password">Show</button>
          </div>
          <p class="hint" id="passHint" hidden>At least 6 characters.</p>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary">Log in</button>
      </form>

      <div class="msg" id="message" role="alert"></div>

      <p class="switch" id="switchText"></p>
    </div>
  </div>
</main>
<script>
// Same domain as the API, so no full URL is needed
const API_URL = "";

try { if (localStorage.getItem("token")) { window.location.href = "index.html"; } } catch (e) { /* ignore */ }

let mode = "login";
const form = document.getElementById("authForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");
const pwInput = document.getElementById("password");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "msg " + type;
}

document.getElementById("togglePw").addEventListener("click", (e) => {
    const show = pwInput.type === "password";
    pwInput.type = show ? "text" : "password";
    e.currentTarget.textContent = show ? "Hide" : "Show";
    e.currentTarget.setAttribute("aria-label", show ? "Hide password" : "Show password");
});

function setMode(newMode) {
    mode = newMode;
    const isLogin = mode === "login";
    document.getElementById("formTitle").textContent = isLogin ? "Log in" : "Create account";
    document.getElementById("formSub").textContent = isLogin
        ? "Log in to see landmarks and your saved trips."
        : "It takes a minute. Your password is stored as a secure hash.";
    submitBtn.textContent = isLogin ? "Log in" : "Create account";
    pwInput.autocomplete = isLogin ? "current-password" : "new-password";
    document.getElementById("nameGroup").hidden = isLogin;
    document.getElementById("passHint").hidden = isLogin;
    document.getElementById("email").previousElementSibling.textContent = isLogin ? "Email or username" : "Email";
    const sw = document.getElementById("switchText");
    sw.textContent = isLogin ? "No account yet? " : "Already have an account? ";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = isLogin ? "Create one" : "Log in";
    btn.addEventListener("click", () => setMode(isLogin ? "register" : "login"));
    sw.append(btn);
    message.className = "msg";
}
setMode("login");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = pwInput.value;
    const path = mode === "login" ? "/auth/login" : "/auth/register";

    submitBtn.disabled = true;
    message.className = "msg";
    try {
        const payload = { email: email, password: password };
        if (mode === "register") { payload.full_name = document.getElementById("fullName").value.trim(); }
        const response = await fetch(API_URL + path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            let detail = "Server error (" + response.status + "). Please try again.";
            if (typeof data.detail === "string") {
                detail = data.detail;
            } else if (Array.isArray(data.detail) && data.detail.length > 0) {
                const names = { full_name: "Full name", email: "Email", password: "Password" };
                detail = data.detail.map((d) => {
                    const field = d.loc && d.loc.length ? d.loc[d.loc.length - 1] : "";
                    const msg = String(d.msg || "").replace(/^Value error, /, "");
                    return (names[field] || field || "Input") + ": " + msg;
                }).join(" | ");
            } else if (mode === "register") {
                detail = "Enter your name, an email, and a password of at least 6 characters.";
            } else {
                detail = "Enter your email or username and your password.";
            }
            showMessage(detail, "error");
            return;
        }

        if (mode === "register") {
            setMode("login");
            showMessage(data.message || "Account created. Log in to continue.", "ok");
            return;
        }

        try {
            localStorage.setItem("token", data.access_token);
            localStorage.setItem("email", data.username || data.email || email);
            localStorage.setItem("name", data.full_name || "");
            localStorage.setItem("role", data.role || "user");
            if (data.home_currency) { localStorage.setItem("currency", data.home_currency); } else { localStorage.removeItem("currency"); }
        } catch (err) {
            showMessage("Your browser blocked saving the login. Allow site storage and try again.", "error");
            return;
        }
        window.location.href = "index.html";
    } catch (err) {
        showMessage("Can't reach the server. Check your connection and try again.", "error");
    } finally {
        submitBtn.disabled = false;
    }
});
</script>
</body>
</html>
