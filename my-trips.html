<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>My trips | Heritage Travels</title>
</head>
<body data-page="trips">
<header class="site-header" id="siteHeader"></header>
<main>
  <div class="wrap">
    <div class="page-head row">
      <div>
        <h1>My trips</h1>
        <p id="summary" aria-live="polite"></p>
      </div>
      <a class="btn btn-primary" href="calculator.html">Estimate a budget</a>
    </div>
    <div class="trips" id="trips"></div>
  </div>
</main>
<dialog id="confirmDialog" aria-labelledby="dlgTitle">
  <form method="dialog">
    <h2 id="dlgTitle">Remove this trip?</h2>
    <p id="dlgText"></p>
    <div class="dialog-actions">
      <button class="btn btn-quiet" value="cancel">Keep trip</button>
      <button class="btn btn-danger" value="confirm">Remove trip</button>
    </div>
  </form>
</dialog>
<footer class="site-footer" id="siteFooter"></footer>
<script src="app.js"></script>
</body>
</html>
